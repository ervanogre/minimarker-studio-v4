name: Publish Public Download Release (APK & EXE)
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Build APK
        run: |
          npm install
          mkdir -p www/libs
          cp node_modules/dxf-parser/dist/dxf-parser.js www/libs/
          cp node_modules/xlsx/dist/xlsx.full.min.js www/libs/
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/libs/
          cp node_modules/jszip/dist/jszip.min.js www/libs/
          rm -rf android
          npx cap add android
          sed -i 's|<application|<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <application android:requestLegacyExternalStorage="true"|g' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../MiniMarker-Studio-V4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: MiniMarker-Studio-V4.apk

  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Portable EXE
        shell: bash
        run: |
          npm install
          npm install --save-dev electron electron-builder
          mkdir -p www/libs
          cp node_modules/dxf-parser/dist/dxf-parser.js www/libs/
          cp node_modules/xlsx/dist/xlsx.full.min.js www/libs/
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/libs/
          cp node_modules/jszip/dist/jszip.min.js www/libs/
          npx electron-builder --win portable --config.appId="com.minimarker.studio.v4" --config.productName="MiniMarker-Studio-V4" --config.directories.output="dist_exe" --config.win.target="portable" --config.files="www/**/*" --config.files="electron-main.js" --config.files="package.json"
          cp dist_exe/*.exe MiniMarker-Studio-V4-Portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: release-exe
          path: MiniMarker-Studio-V4-Portable.exe

  publish-release:
    needs: [build-apk, build-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Create Public Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4-latest
          name: "MiniMarker Studio V4 (Android APK & Windows Portable EXE)"
          body: "Unduh langsung versi terbaru untuk HP Android (.apk) atau PC Windows (.exe) tanpa perlu instalasi."
          files: |
            release-files/MiniMarker-Studio-V4.apk
            release-files/MiniMarker-Studio-V4-Portable.exe
