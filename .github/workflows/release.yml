name: Publish Public Download Release
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          npm install
          mkdir -p www/libs
          cp node_modules/dxf-parser/dist/dxf-parser.js www/libs/
          cp node_modules/xlsx/dist/xlsx.full.min.js www/libs/
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/libs/
          cp node_modules/jszip/dist/jszip.min.js www/libs/
          rm -rf android
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && pip install pillow && python3 apply_mipmap.py
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../MiniMarker-Studio-V4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: MiniMarker-Studio-V4.apk

  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - shell: bash
        run: |
          npm install
          npm install --save-dev electron electron-builder
          mkdir -p www/libs
          cp node_modules/dxf-parser/dist/dxf-parser.js www/libs/
          cp node_modules/xlsx/dist/xlsx.full.min.js www/libs/
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/libs/
          cp node_modules/jszip/dist/jszip.min.js www/libs/
          npx electron-builder --win portable --config.appId="com.minimarker.studio.v4" --config.productName="MiniMarker-Studio-V4" --config.directories.output="dist_exe" --config.win.target="portable" --config.files="www/**/*" --config.files="electron-main.js" --config.files="package.json"
          cp dist_exe/*.exe MiniMarker-Studio-V4-Portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: release-exe
          path: MiniMarker-Studio-V4-Portable.exe

  publish-release:
    needs: [build-apk, build-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v4-latest
          name: "MiniMarker Studio V4 (APK & Portable EXE)"
          files: |
            release-files/MiniMarker-Studio-V4.apk
            release-files/MiniMarker-Studio-V4-Portable.exe
