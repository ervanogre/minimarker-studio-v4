name: Build Minimarker PC Portable (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-portable:
    runs-on: windows-latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Electron Builder
        run: |
          npm install
          npm install --save-dev electron electron-builder

      - name: Build Windows Portable (.exe)
        run: npx electron-builder --win portable

      - name: Upload File PC Portable (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Minimarker-Studio-PC-Portable
          path: dist/*.exe
